[project]
name = "nervos-workspace"
version = "0.1.0"
description = "NervOS Stage A Python workspace"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/scheduler",
    "apps/worker",
    "packages/nervos-core",
    "packages/nervos-mcp",
    "packages/nervos-models",
    "packages/nervos-sdk",
    "packages/nervos-package-host",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.400,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = [
    "tests",
    "apps/api/tests",
    "apps/scheduler/tests",
    "apps/worker/tests",
    "packages/nervos-core/tests",
    "packages/nervos-mcp/tests",
    "packages/nervos-models/tests",
    "packages/nervos-sdk/tests",
    "packages/nervos-package-host/tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
".codex/**" = ["E501"]
"apps/api/tests/integration/test_migrations.py" = ["E501"]
"packages/nervos-core/tests/integration/test_package_installation_service.py" = ["E402", "E501"]
"packages/nervos-core/tests/integration/test_package_registry_persistence.py" = ["E402", "E501", "F401"]
"packages/nervos-core/tests/integration/test_stage_g3_acceptance.py" = ["E402", "E501", "F401", "F841"]
"packages/nervos-core/tests/unit/test_package_host_protocol.py" = ["E501"]
"packages/nervos-core/tests/unit/test_package_installation_domain.py" = ["F401"]
"packages/nervos-core/tests/unit/test_package_storage.py" = ["E501", "F401", "I001", "RUF059"]
"packages/nervos-package-host/tests/test_runner.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = [
    "apps/api/src",
    "apps/api/alembic",
    "apps/api/tests",
    "apps/scheduler/src",
    "apps/scheduler/tests",
    "apps/worker/src",
    "apps/worker/tests",
    "packages/nervos-core/src",
    "packages/nervos-core/tests",
    "packages/nervos-mcp/src",
    "packages/nervos-mcp/tests",
    "packages/nervos-models/src",
    "packages/nervos-models/tests",
    "packages/nervos-sdk/src",
    "packages/nervos-sdk/tests",
    "packages/nervos-package-host/src",
    "packages/nervos-package-host/tests",
    "scripts",
    "tests",
]
exclude = [
    ".venv",
    "**/__pycache__",
]
extraPaths = [
    "apps/api/src",
    "apps/scheduler/src",
    "apps/worker/src",
    "packages/nervos-core/src",
    "packages/nervos-mcp/src",
    "packages/nervos-models/src",
    "packages/nervos-sdk/src",
    "packages/nervos-package-host/src",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
