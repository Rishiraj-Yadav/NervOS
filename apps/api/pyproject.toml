[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nervos-api"
version = "0.1.0"
description = "NervOS local control-plane API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "nervos-core",
    "nervos-models",
    "nervos-mcp",
    "pydantic-settings>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv.sources]
nervos-core = { workspace = true }
nervos-models = { workspace = true }
nervos-mcp = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nervos_api"]
