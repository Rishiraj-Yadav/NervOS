[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nervos-scheduler"
version = "0.1.0"
description = "NervOS schedule evaluation process"
requires-python = ">=3.12"
dependencies = [
    "nervos-core",
    "pydantic-settings>=2,<3",
]

[tool.uv.sources]
nervos-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nervos_scheduler"]
