# Disposable TEST infrastructure. These public synthetic credentials are not deployment secrets.
services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: marketplace_test
      POSTGRES_USER: fixture_admin
      POSTGRES_PASSWORD: synthetic-admin-password
    ports:
      - "127.0.0.1:${MP_TEST_PG_PORT:-0}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture_admin -d marketplace_test"]
      interval: 2s
      timeout: 2s
      retries: 40
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data", "-s3.config=/etc/mp-test-identities.json", "-bucket=marketplace-test", "-admin.ui=false", "-webdav=false"]
    volumes:
      - ./s3-test-identities.json:/etc/mp-test-identities.json:ro
    ports:
      - "127.0.0.1:${MP_TEST_S3_PORT:-0}:8333"
