[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nervos-worker"
version = "0.1.0"
description = "NervOS execution-plane worker"
requires-python = ">=3.12"
dependencies = [
    "nervos-core",
    "nervos-models",
    "nervos-mcp",
    "pydantic-settings>=2,<3",
]

[tool.uv.sources]
nervos-core = { workspace = true }
nervos-models = { workspace = true }
nervos-mcp = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nervos_worker"]
