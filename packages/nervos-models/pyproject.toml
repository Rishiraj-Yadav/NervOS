[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nervos-models"
version = "0.1.0"
description = "NervOS concrete model-provider adapters"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5,<2",
    "openai>=3.13,<4",
    "nervos-core",
]

[tool.uv.sources]
nervos-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nervos_models"]
